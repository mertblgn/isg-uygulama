<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>İSG Katip Portalı</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#0f172a; --panel:#1e293b; --card:#334155; --text:#f8fafc; --muted:#94a3b8;
  --accent:#38bdf8; --border:#475569; --danger:#ef4444; --success:#22c55e;
}
* { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif; }
body { background:var(--bg); color:var(--text); line-height:1.5; padding-bottom:60px; }
header { background:var(--panel); border-bottom:1px solid var(--border); padding:1rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
.logo { font-weight:bold; font-size:1.2rem; color:var(--accent); display:flex; align-items:center; gap:0.5rem; }
.btn { background:var(--accent); color:#000; border:none; padding:0.5rem 1rem; border-radius:0.375rem; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; font-size:0.9rem; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-sm { padding:0.25rem 0.5rem; font-size:0.8rem; }
.container { max-width:800px; margin:0 auto; padding:1rem; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:0.5rem; padding:1rem; margin-bottom:1rem; }
.form-group { margin-bottom:1rem; }
.form-group label { display:block; margin-bottom:0.25rem; font-size:0.85rem; color:var(--muted); }
.form-control { width:100%; padding:0.6rem; background:var(--card); border:1px solid var(--border); border-radius:0.375rem; color:var(--text); font-size:0.95rem; }
.form-control:focus { outline:none; border-color:var(--accent); }
.checkbox-group { display:flex; items-center:center; gap:0.5rem; margin-bottom:0.5rem; }
.checkbox-group input { width:auto; }
.auth-container { max-width:400px; margin:2rem auto; }
.hidden { display:none !important; }
.panel-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:200; display:flex; justify-content:center; align-items:center; padding:1rem; }
.panel-content { background:var(--panel); border:1px solid var(--border); border-radius:0.5rem; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; padding:1.5rem; }
</style>
</head>
<body>

<header>
  <div class="logo">⚡ İSG Portalı</div>
  <div id="nav-actions"></div>
</header>

<div class="container">
  <div id="auth-panel" class="auth-container card">
    <h2 id="auth-title" style="margin-bottom:1rem; text-align:center;">Giriş Yap</h2>
    <div id="auth-form">
      <div class="form-group">
        <label>E-Posta</label>
        <input type="email" id="ai" class="form-control" placeholder="ornek@email.com">
      </div>
      <div class="form-group" id="phone-group">
        <label>Telefon (+90 5XX XXX XX XX)</label>
        <input type="tel" id="aphone" class="form-control" placeholder="+90 5XX XXX XX XX">
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="ap" class="form-control" placeholder="******">
      </div>
      
      <div id="consent-group">
        <div class="checkbox-group">
          <input type="checkbox" id="c1">
          <label for="c1">KVKK Metnini okudum, kabul ediyorum.</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="c2">
          <label for="c2">Gizlilik Politikasını okudum, kabul ediyorum.</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="c3">
          <label for="c3">Çerez Politikasını okudum, kabul ediyorum.</label>
        </div>
      </div>

      <button id="auth-submit" class="btn" style="width:100%; margin-top:1rem;" onclick="initLogin()">Giriş Yap</button>
      
      <div style="margin-top:1rem; text-align:center; font-size:0.85rem;">
        <span id="auth-switch-text">Hesabınız yok mu?</span>
        <a href="javascript:void(0)" id="auth-switch-btn" onclick="toggleAuthMode()" style="color:var(--accent);">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <div class="card">
      <h3>Hoş Geldiniz</h3>
      <p style="color:var(--muted); margin-top:0.5rem;">Sisteme başarıyla giriş yaptınız. İSG süreçlerinizi yönetmeye başlayabilirsiniz.</p>
    </div>
  </div>
</div>

<div id="modal-panel" class="panel-overlay hidden">
  <div class="panel-content" id="modal-body"></div>
</div>

<script>
// Supabase Yapılandırması
const SUPABASE_URL = "https://YOUR_SUPABASE_URL.supabase.co"; 
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUserId = null;
let isPasswordRecovery = false;
let isSignupMode = false;
let db = { companies: [], profile: {}, emsal: [], events: [] };

function $(id) { return document.getElementById(id); }

async function get(store, key) {
  try {
    const val = localStorage.getItem(key);
    return val ? JSON.parse(val) : null;
  } catch(e) { return null; }
}

async function put(store, key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch(e) {}
}

function norm() {
  if(!db.companies) db.companies = [];
  if(!db.profile) db.profile = {};
  if(!db.emsal) db.emsal = [];
  if(!db.events) db.events = [];
}

function consentAll() {
  return $('c1').checked && $('c2').checked && $('c3').checked;
}

function consentOk() {
  return localStorage.getItem('consent_' + currentUserId) === 'true';
}

function saveConsent() {
  if(currentUserId) {
    localStorage.setItem('consent_' + currentUserId, 'true');
  }
}

function normalizePhone(p) {
  p = p.replace(/\D/g, '');
  if(p.startsWith('0')) p = p.substring(1);
  if(!p.startsWith('90')) p = '90' + p;
  return '+' + p;
}

function closePanel() {
  $('modal-panel').classList.add('hidden');
}

function toggleAuthMode() {
  isSignupMode = !isSignupMode;
  if(isSignupMode) {
    $('auth-title').innerText = "Kayıt Ol";
    $('phone-group').classList.remove('hidden');
    $('consent-group').classList.remove('hidden');
    $('auth-submit').innerText = "Kayıt Ol";
    $('auth-submit').setAttribute('onclick', 'initSignup()');
    $('auth-switch-text').innerText = "Zaten hesabınız var mı?";
    $('auth-switch-btn').innerText = "Giriş Yap";
  } else {
    $('auth-title').innerText = "Giriş Yap";
    $('phone-group').classList.add('hidden');
    $('consent-group').classList.add('hidden');
    $('auth-submit').innerText = "Giriş Yap";
    $('auth-submit').setAttribute('onclick', 'initLogin()');
    $('auth-switch-text').innerText = "Hesabınız yok mu?";
    $('auth-switch-btn').innerText = "Kayıt Ol";
  }
}

function authUI(isLoggedIn) {
  if(isLoggedIn) {
    $('auth-panel').classList.add('hidden');
    $('app-content').classList.remove('hidden');
    $('nav-actions').innerHTML = `<button class="btn btn-outline btn-sm" onclick="logout()">Çıkış Yap</button>`;
  } else {
    $('auth-panel').classList.remove('hidden');
    $('app-content').classList.add('hidden');
    $('nav-actions').innerHTML = '';
    toggleAuthMode();
    isSignupMode = true;
    toggleAuthMode();
  }
}

function home() {
  authUI(1);
}

async function logout() {
  await sb.auth.signOut();
  currentUserId = null;
  authUI(0);
}

async function gate(){
    closePanel();
    try {
        const { data: { session }, error } = await sb.auth.getSession();
        if(error) throw error;
        if(isPasswordRecovery) return;
        if(!session || !session.user){
            currentUserId=null;
            db={companies:[], profile:{}, emsal:[], events:[]};
            authUI(0);
            return;
        }
        if(isPasswordRecovery) return;
        currentUserId=session.user.id;
        const key='db:'+currentUserId;
        let userDb=await get('kv',key);
        if(!userDb){
            const legacy=await get('kv','db');
            if(legacy && (legacy.companies?.length || legacy.profile && Object.keys(legacy.profile).length)){
                if(confirm('Bu tarayıcıda eski İSG kayıtları bulundu. Bunları yalnızca bu hesaba aktarmak ister misiniz?')){
                    userDb=legacy;
                    await put('kv',key,userDb);
                }
            }
        }
        db=userDb || {companies:[], profile:{}, emsal:[], events:[]};
        norm();
        if(!consentOk()){
            saveConsent();
        }
        home();
    } catch(e) {
        console.error(e);
        authUI(0);
        alert('Oturum kontrolünde sorun oluştu. Supabase ayarlarını ve bağlantıyı kontrol edin.');
    }
}

async function initLogin() {
  const email = $('ai').value.trim().toLowerCase();
  const password = $('ap').value;
  if(!email || !password) return alert('E-posta ve şifrenizi girin.');
  
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error) return alert('Giriş başarısız: ' + error.message);
  await gate();
}

async function initSignup(){
    if(!consentAll()) return alert('Lütfen KVKK, Gizlilik ve Çerez Politikası onay kutucuklarının tümünü işaretleyin.');
    const email=$('ai').value.trim().toLowerCase();
    const phone=normalizePhone($('aphone').value);
    const password=$('ap').value;
    if(!email) return alert('Geçerli bir e-posta adresi girin.');
    if(!phone) return alert('Telefonu +90 5XX XXX XX XX biçiminde girin.');
    if(password.length<8) return alert('Şifre en az 8 karakter olmalı.');
    const {data,error}=await sb.auth.signUp({
        email,password,
        options:{
            data:{phone},
            emailRedirectTo:window.location.origin+window.location.pathname
        }
    });
    if(error) return alert('Kayıt oluşturulamadı: '+error.message);
    saveConsent();
    if(data.session){
        await gate();
    } else {
        alert('Kayıt başarılı! Lütfen e-posta adresinize gelen doğrulama bağlantısına tıklayın.');
    }
}

// Uygulama Başlangıcı
window.addEventListener('DOMContentLoaded', () => {
  gate();
});
</script>
</body>
</html>
